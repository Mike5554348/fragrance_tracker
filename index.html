<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>我的香氛誌</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1f2421;
      --muted: #6b726e;
      --accent: #2f5241;
      --accent-soft: #e6efe9;
      --border: #e3e0d8;
      --danger: #b43b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 244, 239, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    h1 { margin: 0; font-size: 1.15rem; }
    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-danger {
      color: var(--danger);
      border-color: #ebcaca;
      background: #fff8f8;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 14px 16px; }
    .tabs, .cat-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-size: 0.8rem; color: var(--muted); }
    .name { font-size: 1rem; font-weight: 600; margin: 2px 0 6px; }
    .meta { font-size: 0.85rem; color: var(--text); display: flex; flex-wrap: wrap; gap: 10px; }
    .unit-price { color: var(--accent); font-weight: 600; }
    .tag-pill {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-top: 6px;
    }
    .actions { display: flex; flex-direction: column; gap: 6px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .calc-preview {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 12px;
    }
    .tag-manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>我的香氛誌</h1>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="openTagModal()">管理分類</button>
      <button class="btn" onclick="syncFromSheet()">同步</button>
      <button class="btn btn-primary" onclick="openFormModal()">＋ 新增</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs" id="listTabs">
      <button class="chip active" data-list="all" onclick="setList('all', this)">全部</button>
      <button class="chip" data-list="owned" onclick="setList('owned', this)">已持有</button>
      <button class="chip" data-list="try" onclick="setList('try', this)">待試香</button>
      <button class="chip" data-list="buy" onclick="setList('buy', this)">待購買</button>
    </div>

    <div class="cat-bar" id="categoryBar"></div>
    <div id="fragranceList"></div>
  </div>

  <!-- 新增/編輯香水 Modal -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal">
      <h2 id="formTitle" style="margin-top:0;">新增香氛</h2>
      <form onsubmit="saveFragrance(event)">
        <input type="hidden" id="fId" />
        <div class="row-2">
          <div class="field">
            <label>清單狀態</label>
            <select id="fList">
              <option value="owned">已持有</option>
              <option value="try">待試香</option>
              <option value="buy">待購買</option>
            </select>
          </div>
          <div class="field">
            <label>分類標籤</label>
            <select id="fCategory"></select>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label>品牌</label>
            <input type="text" id="fBrand" required />
          </div>
          <div class="field">
            <label>香水名稱</label>
            <input type="text" id="fName" required />
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label>價格（僅填純數字，例：3680）</label>
            <input type="number" id="fPrice" min="0" step="1" placeholder="例如 3680" oninput="updateLiveCalc()" />
          </div>
          <div class="field">
            <label>容量 ml 數（純數字，例：100）</label>
            <input type="number" id="fVolume" min="0" step="any" placeholder="例如 100" oninput="updateLiveCalc()" />
          </div>
        </div>
        <div class="calc-preview" id="liveCalcBox">每 ml 單價：—</div>
        <div class="field">
          <label>香調／備註</label>
          <textarea id="fMemo" rows="3"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" class="btn" onclick="closeModal('formModal')">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 分類標籤管理 Modal -->
  <div class="modal-backdrop" id="tagModal">
    <div class="modal">
      <h2 style="margin-top:0;">新增或編輯分類標籤</h2>
      <div class="field" style="display:flex; gap:8px;">
        <input type="text" id="newTagInput" placeholder="輸入新分類名稱，例如：身體噴霧" />
        <button type="button" class="btn btn-primary" onclick="addCategory()">新增</button>
      </div>
      <div id="tagManageList"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button type="button" class="btn" onclick="closeModal('tagModal')">完成</button>
      </div>
    </div>
  </div>

  <script>
    // 若有使用 Google Apps Script 網址，可填入下方；留空則使用本機儲存
    const API_URL = "";

    const STORAGE_ITEMS_KEY = "scent_log_items_v2";
    const STORAGE_CATS_KEY = "scent_log_categories_v2";

    const DEFAULT_CATEGORIES = ["個人香水", "空間噴霧", "試管／分裝"];
    const DEFAULT_ITEMS = [
      { id: "1", list: "owned", category: "個人香水", brand: "Novigo", name: "黑海淡香精", price: 0, volumeMl: 10, memo: "10ml" },
      { id: "2", list: "owned", category: "個人香水", brand: "Novigo", name: "撒哈拉沙漠淡香精", price: 0, volumeMl: 10, memo: "10ml" },
      { id: "3", list: "try", category: "個人香水", brand: "NOSEWAY", name: "Formosa 小小多山的國家", price: 3680, volumeMl: 100, memo: "100ml" }
    ];

    let currentList = "all";
    let currentCategory = "all";
    let items = loadItems();
    let categories = loadCategories();

    function loadItems() {
      const raw = localStorage.getItem(STORAGE_ITEMS_KEY);
      if (!raw) return [...DEFAULT_ITEMS];
      try { return JSON.parse(raw); } catch { return [...DEFAULT_ITEMS]; }
    }

    function loadCategories() {
      const raw = localStorage.getItem(STORAGE_CATS_KEY);
      if (!raw) return [...DEFAULT_CATEGORIES];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : [...DEFAULT_CATEGORIES];
      } catch {
        return [...DEFAULT_CATEGORIES];
      }
    }

    function persistAll() {
      localStorage.setItem(STORAGE_ITEMS_KEY, JSON.stringify(items));
      localStorage.setItem(STORAGE_CATS_KEY, JSON.stringify(categories));
    }

    // 格式化價格為 NT$ XX,XXX
    function formatPrice(price) {
      const num = Number(price);
      if (!num || num <= 0) return "未填寫";
      return "NT$ " + Math.round(num).toLocaleString("en-US");
    }

    // 計算每 ml 單價
    function calcUnitPrice(price, volumeMl) {
      const p = Number(price);
      const v = Number(volumeMl);
      if (!p || p <= 0 || !v || v <= 0) return null;
      return p / v;
    }

    function formatUnitPrice(price, volumeMl) {
      const unit = calcUnitPrice(price, volumeMl);
      if (unit === null) return "—";
      const displayUnit = Number.isInteger(Number(unit.toFixed(1)))
        ? Math.round(unit).toLocaleString("en-US")
        : Number(unit.toFixed(1)).toLocaleString("en-US");
      return `NT$ ${displayUnit} / ml`;
    }

    function updateLiveCalc() {
      const p = document.getElementById("fPrice").value;
      const v = document.getElementById("fVolume").value;
      document.getElementById("liveCalcBox").textContent = "每 ml 單價：" + formatUnitPrice(p, v);
    }

    function setList(listKey, el) {
      currentList = listKey;
      document.querySelectorAll("#listTabs .chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      render();
    }

    function setCategory(catKey) {
      currentCategory = catKey;
      render();
    }

    function renderCategoryBar() {
      const bar = document.getElementById("categoryBar");
      const allCats = ["all", ...categories];
      bar.innerHTML = allCats.map(cat => {
        const label = cat === "all" ? "全部分類" : cat;
        const active = currentCategory === cat ? "active" : "";
        return `<button class="chip ${active}" onclick="setCategory('${escapeAttr(cat)}')">${escapeHtml(label)}</button>`;
      }).join("");
    }

    function renderCategorySelect(selectedCat) {
      const sel = document.getElementById("fCategory");
      if (!categories.includes(selectedCat) && selectedCat) {
        categories.push(selectedCat);
        persistAll();
      }
      sel.innerHTML = categories.map(cat =>
        `<option value="${escapeAttr(cat)}" ${cat === selectedCat ? "selected" : ""}>${escapeHtml(cat)}</option>`
      ).join("");
    }

    function render() {
      renderCategoryBar();
      const listEl = document.getElementById("fragranceList");
      const filtered = items.filter(item => {
        const matchList = currentList === "all" || item.list === currentList;
        const matchCat = currentCategory === "all" || item.category === currentCategory;
        return matchList && matchCat;
      });

      if (!filtered.length) {
        listEl.innerHTML = `<p style="color:var(--muted); text-align:center; padding:24px;">目前沒有符合條件的香氛紀錄</p>`;
        return;
      }

      listEl.innerHTML = filtered.map(item => {
        const volText = item.volumeMl ? `${Number(item.volumeMl)} ml` : "容量未填";
        return `
          <div class="card">
            <div>
              <div class="brand">${escapeHtml(item.brand)}</div>
              <div class="name">${escapeHtml(item.name)}</div>
              <div class="meta">
                <span>${escapeHtml(volText)}</span>
                <span>${formatPrice(item.price)}</span>
                <span class="unit-price">${formatUnitPrice(item.price, item.volumeMl)}</span>
              </div>
              <span class="tag-pill">${escapeHtml(item.category || "未分類")}</span>
              ${item.memo ? `<div style="font-size:0.83rem; color:var(--muted); margin-top:6px;">${escapeHtml(item.memo)}</div>` : ""}
            </div>
            <div class="actions">
              <button class="btn" onclick="openFormModal('${item.id}')">編輯</button>
              <button class="btn btn-danger" onclick="deleteItem('${item.id}')">刪除</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function openFormModal(id = null) {
      const target = id ? items.find(x => x.id === id) : null;
      document.getElementById("formTitle").textContent = target ? "編輯香氛" : "新增香氛";
      document.getElementById("fId").value = target ? target.id : "";
      document.getElementById("fList").value = target ? target.list : (currentList === "all" ? "owned" : currentList);
      renderCategorySelect(target ? target.category : (categories[0] || "個人香水"));
      document.getElementById("fBrand").value = target ? target.brand : "";
      document.getElementById("fName").value = target ? target.name : "";
      document.getElementById("fPrice").value = target && target.price ? Number(target.price) : "";
      document.getElementById("fVolume").value = target && target.volumeMl ? Number(target.volumeMl) : "";
      document.getElementById("fMemo").value = target ? (target.memo || "") : "";
      updateLiveCalc();
      document.getElementById("formModal").classList.add("open");
    }

    function saveFragrance(e) {
      e.preventDefault();
      const id = document.getElementById("fId").value || String(Date.now());
      const rawPrice = document.getElementById("fPrice").value.trim();
      const rawVol = document.getElementById("fVolume").value.trim();

      const record = {
        id,
        list: document.getElementById("fList").value,
        category: document.getElementById("fCategory").value,
        brand: document.getElementById("fBrand").value.trim(),
        name: document.getElementById("fName").value.trim(),
        price: rawPrice === "" ? 0 : Math.max(0, Number(rawPrice)),
        volumeMl: rawVol === "" ? 0 : Math.max(0, Number(rawVol)),
        memo: document.getElementById("fMemo").value.trim()
      };

      const idx = items.findIndex(x => x.id === id);
      if (idx >= 0) items[idx] = record;
      else items.unshift(record);

      persistAll();
      closeModal("formModal");
      render();
      pushToSheet(record);
    }

    function deleteItem(id) {
      const target = items.find(x => x.id === id);
      if (!target) return;
      if (!confirm(`確定要刪除「${target.brand} - ${target.name}」嗎？`)) return;
      items = items.filter(x => x.id !== id);
      persistAll();
      render();
    }

    function openTagModal() {
      document.getElementById("newTagInput").value = "";
      renderTagManageList();
      document.getElementById("tagModal").classList.add("open");
    }

    function renderTagManageList() {
      const container = document.getElementById("tagManageList");
      container.innerHTML = categories.map((cat, index) => `
        <div class="tag-manage-item">
          <input type="text" id="tagEdit_${index}" value="${escapeAttr(cat)}" style="flex:1; padding:6px 8px; border:1px solid var(--border); border-radius:8px;" />
          <button type="button" class="btn" onclick="renameCategory(${index})">儲存改名</button>
          <button type="button" class="btn btn-danger" onclick="removeCategory(${index})">移除</button>
        </div>
      `).join("");
    }

    function addCategory() {
      const input = document.getElementById("newTagInput");
      const val = input.value.trim();
      if (!val) return;
      if (!categories.includes(val)) {
        categories.push(val);
        persistAll();
        render();
        renderTagManageList();
      }
      input.value = "";
    }

    function renameCategory(index) {
      const oldName = categories[index];
      const newName = document.getElementById(`tagEdit_${index}`).value.trim();
      if (!newName || oldName === newName) return;
      if (categories.includes(newName)) {
        alert("已有同名的分類標籤");
        return;
      }
      categories[index] = newName;
      items = items.map(it => it.category === oldName ? { ...it, category: newName } : it);
      if (currentCategory === oldName) currentCategory = newName;
      persistAll();
      render();
      renderTagManageList();
    }

    function removeCategory(index) {
      if (categories.length <= 1) {
        alert("至少要保留一個分類標籤");
        return;
      }
      const targetName = categories[index];
      const fallback = categories.find((_, i) => i !== index);
      items = items.map(it => it.category === targetName ? { ...it, category: fallback } : it);
      categories.splice(index, 1);
      if (currentCategory === targetName) currentCategory = "all";
      persistAll();
      render();
      renderTagManageList();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    async function syncFromSheet() {
      if (!API_URL) {
        render();
        alert("目前為本機模式，已重新整理畫面。");
        return;
      }
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (Array.isArray(data.items)) {
          items = data.items;
          persistAll();
          render();
        }
      } catch (err) {
        alert("同步失敗，請檢查 Apps Script 網址。");
      }
    }

    async function pushToSheet(record) {
      if (!API_URL) return;
      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "upsert", item: record })
        });
      } catch (_) {}
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    render();
  </script>
</body>
</html>
